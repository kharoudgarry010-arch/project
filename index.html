<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GO Transit Weekend Pass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ticket">
    <section class="header">
      <div class="go-logo">
        <div class="logo-shape"></div>
        <div class="logo-circle"></div>
      </div>

      <div class="go-text">GO TRANSIT</div>

      <div class="route">
        Bramalea GO to Allandale Waterfront GO -<br>
        Weekend Pass
      </div>

      <div class="notch"></div>
    </section>

    <section class="pass-info">
      <div class="pass-grid">
        <div>
          <div class="pass-count">x1</div>
          <div class="pass-label">Passenger(s)</div>
          <div class="pass-description">1x Weekend Pass</div>
        </div>

        <div>
          <div class="train"></div>
          <div class="pass-label">Multi Use Pass</div>
        </div>
      </div>

      <div class="barcode-section">
        <div class="ticket-number">
          Ticket Number: <strong>MZ68122693</strong>
        </div>

        <div class="barcode">
          <div class="barcode-lines"></div>
          <div class="active-box">ACTIVE</div>
        </div>

        <div class="timers">
          <div>
            <div class="timer-title">CURRENT DATE & TIME:</div>
            <div class="timer-value" id="currentTime">--</div>
          </div>

          <div>
            <div class="timer-title">TIME SINCE ACTIVATION:</div>
            <div class="timer-value" id="activationTime">00:18:59</div>
          </div>
        </div>
      </div>
    </section>

    <section class="bottom">
      <div class="bottom-message">
        Please show proof of your ticket to<br>
        the Customer Protective Officers<br>
        when asked
      </div>

      <div class="countdown" id="countdown">23:41:00</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
