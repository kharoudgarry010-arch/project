<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Phone-only viewport -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>GO Transit Weekend Pass</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;
      background: #4f477f;
    }

    body {
      width: 100vw;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: stretch;

      overflow: hidden;
    }


    /* =========================================================
       PHONE TICKET
    ========================================================= */

    .ticket {
      width: 100%;
      height: 100dvh;

      background: white;
      color: #30343b;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      position: relative;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      /*
        Takes approximately 23% of the phone screen.
      */
      flex: 0 0 23%;

      min-height: 0;

      background: #4f477f;
      color: white;

      position: relative;
      text-align: center;

      padding-top: clamp(18px, 4vh, 43px);

      overflow: hidden;
    }


    .header::before,
    .header::after {
      content: "";

      position: absolute;

      top: 47%;

      width: 14px;
      height: 14px;

      background: white;
      border-radius: 50%;
    }


    .header::before {
      left: 29px;
    }


    .header::after {
      right: 29px;
    }


    /* =========================================================
       GO LOGO
    ========================================================= */

    .go-logo {
      width: clamp(120px, 38vw, 170px);
      height: clamp(63px, 20vw, 90px);

      margin: 0 auto clamp(12px, 3vh, 35px);

      position: relative;
    }


    .logo-circle {
      position: absolute;

      width: 48%;
      height: 91%;

      right: 5%;
      top: 0;

      background: white;
      border-radius: 50%;
    }


    .logo-circle::before {
      content: "";

      position: absolute;

      left: -1%;
      top: 46%;

      width: 104%;
      height: 10%;

      background: #4f477f;
    }


    .logo-circle::after {
      content: "";

      position: absolute;

      left: 47%;
      top: 0;

      width: 11%;
      height: 100%;

      background: #4f477f;
    }


    .logo-shape {
      position: absolute;

      left: 2%;
      top: 0;

      width: 41%;
      height: 91%;

      background: white;

      border-radius: 50% 0 0 50%;
    }


    .logo-shape::after {
      content: "";

      position: absolute;

      width: 11%;
      height: 100%;

      right: 26%;
      top: 0;

      background: #4f477f;
    }


    /* =========================================================
       GO TRANSIT TITLE
    ========================================================= */

    .go-text {
      font-size: clamp(20px, 6vw, 28px);

      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: clamp(10px, 2.5vh, 34px);
    }


    /* =========================================================
       ROUTE
    ========================================================= */

    .route {
      font-size: clamp(15px, 5vw, 21px);

      line-height: 1.3;

      font-weight: 400;

      padding: 0 25px;
    }


    /* =========================================================
       TICKET NOTCH
    ========================================================= */

    .notch {
      position: absolute;

      bottom: -17px;

      left: 50%;

      transform: translateX(-50%);

      width: 42px;
      height: 42px;

      background: white;

      border-radius: 50%;

      z-index: 3;
    }


    .notch::after {
      content: "";

      position: absolute;

      inset: 7px;

      border-radius: 50%;

      background: #4f477f;
    }


    /* =========================================================
       PASS INFORMATION
    ========================================================= */

    .pass-info {
      /*
        White middle section.
      */

      flex: 0 0 45%;

      min-height: 0;

      background: white;

      position: relative;

      padding: clamp(18px, 4vh, 45px) 0 10px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    /* =========================================================
       PASS GRID
    ========================================================= */

    .pass-grid {
      width: 100%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      align-items: center;

      text-align: center;

      flex: 0 0 auto;

      margin-bottom: clamp(10px, 2vh, 25px);
    }


    .pass-count {
      font-size: clamp(50px, 15vw, 80px);

      font-weight: 300;

      line-height: 0.8;

      margin-bottom: clamp(12px, 2vh, 25px);
    }


    .pass-label {
      font-size: clamp(16px, 5vw, 22px);

      font-weight: 800;

      margin-bottom: clamp(10px, 2vh, 26px);
    }


    .pass-description {
      font-size: clamp(14px, 4.5vw, 18px);

      font-weight: 400;
    }


    /* =========================================================
       TRAIN ICON
    ========================================================= */

    .train {
      width: clamp(36px, 12vw, 46px);
      height: clamp(48px, 15vw, 62px);

      margin: 0 auto clamp(10px, 2vh, 20px);

      background: #b5b7ba;

      border-radius: 11px 11px 7px 7px;

      position: relative;
    }


    .train::before {
      content: "";

      position: absolute;

      width: 61%;

      height: 29%;

      background: white;

      top: 15%;

      left: 19%;

      border-radius: 2px;
    }


    .train::after {
      content: "●  ●";

      position: absolute;

      bottom: 3px;
      left: 15%;

      color: white;

      font-size: clamp(10px, 3vw, 13px);

      letter-spacing: 2px;
    }


    /* =========================================================
       TICKET NUMBER / BARCODE
    ========================================================= */

    .barcode-section {
      width: calc(100% - 14px);

      margin: 0 7px;

      border-top: 3px dotted #b9b9b9;

      padding-top: clamp(8px, 1.5vh, 18px);

      text-align: center;

      flex: 0 0 auto;
    }


    .ticket-number {
      font-size: clamp(15px, 4.8vw, 21px);

      margin-bottom: clamp(10px, 2vh, 20px);

      color: #111;

      white-space: nowrap;
    }


    .ticket-number strong {
      font-size: clamp(18px, 5.5vw, 25px);

      letter-spacing: 1px;
    }


    /* =========================================================
       BARCODE
    ========================================================= */

    .barcode {
      height: clamp(48px, 10vh, 82px);

      margin: 0 clamp(25px, 12vw, 48px);

      display: flex;

      align-items: stretch;

      justify-content: center;

      overflow: hidden;

      position: relative;
    }


    .barcode-lines {
      width: 100%;
      height: 100%;

      background:
        repeating-linear-gradient(
          90deg,
          #b8bbc0 0px,
          #b8bbc0 5px,
          white 5px,
          white 9px,
          #b8bbc0 9px,
          #b8bbc0 13px,
          white 13px,
          white 17px,
          #b8bbc0 17px,
          #b8bbc0 26px,
          white 26px,
          white 31px
        );
    }


    /* =========================================================
       ACTIVE BOX
    ========================================================= */

    .active-box {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: white;

      padding: clamp(5px, 1.5vw, 9px)
               clamp(14px, 5vw, 25px);

      color: #696091;

      font-size: clamp(17px, 6vw, 25px);

      letter-spacing: 2px;

      border: 5px dotted #b8bbc0;

      white-space: nowrap;
    }


    /* =========================================================
       TIMERS
    ========================================================= */

    .timers {
      width: 100%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      margin-top: clamp(10px, 2vh, 25px);

      text-align: center;

      gap: 5px;
    }


    .timer-title {
      font-size: clamp(8px, 2.7vw, 12px);

      font-weight: 800;

      margin-bottom: 5px;

      white-space: nowrap;
    }


    .timer-value {
      font-size: clamp(11px, 3.5vw, 20px);

      font-weight: 700;

      white-space: nowrap;
    }


    /* =========================================================
       BOTTOM COUNTDOWN
    ========================================================= */

    .bottom {
      /*
        Remaining space on the phone.
      */

      flex: 1;

      min-height: 0;

      background: #4f477f;

      color: white;

      text-align: center;

      padding: 20px 25px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;
    }


    .bottom-message {
      font-size: clamp(15px, 5vw, 21px);

      line-height: 1.35;

      margin-bottom: clamp(15px, 4vh, 38px);
    }


    .countdown {
      font-size: clamp(36px, 12vw, 50px);

      font-weight: 300;

      letter-spacing: 1px;

      white-space: nowrap;
    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-height: 700px) {

      .header {
        flex-basis: 22%;
      }

      .pass-info {
        flex-basis: 48%;
      }

      .go-logo {
        margin-bottom: 8px;
      }

      .go-text {
        margin-bottom: 8px;
      }

      .pass-grid {
        margin-bottom: 8px;
      }

      .ticket-number {
        margin-bottom: 8px;
      }

      .timers {
        margin-top: 8px;
      }

      .bottom-message {
        margin-bottom: 12px;
      }
    }


    /* =========================================================
       LANDSCAPE PHONE
    ========================================================= */

    @media (orientation: landscape) {

      .ticket {
        display: none;
      }

      body::before {
        content: "Please rotate your phone vertically";

        width: 100%;
        height: 100%;

        display: flex;

        align-items: center;
        justify-content: center;

        color: white;

        font-size: 20px;

        text-align: center;

        padding: 30px;
      }
    }


    /* =========================================================
       DESKTOP / TABLET
       Keeps the page phone-oriented.
    ========================================================= */

    @media (min-width: 600px) {

      body {
        background: #222;
      }

      .ticket {
        width: 390px;
        max-width: 390px;

        height: 100dvh;

        margin: 0 auto;
      }
    }

  </style>
</head>


<body>

  <main class="ticket">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="header">

      <div class="go-logo">

        <div class="logo-shape"></div>

        <div class="logo-circle"></div>

      </div>


      <div class="go-text">
        GO TRANSIT
      </div>


      <div class="route">
        Bramalea GO to Allandale Waterfront GO -
        <br />
        Weekend Pass
      </div>


      <div class="notch"></div>

    </section>



    <!-- =====================================================
         PASS INFORMATION
    ====================================================== -->

    <section class="pass-info">

      <div class="pass-grid">

        <!-- PASSENGERS -->

        <div>

          <div class="pass-count">
            x1
          </div>


          <div class="pass-label">
            Passenger(s)
          </div>


          <div class="pass-description">
            1x Weekend Pass
          </div>

        </div>


        <!-- MULTI USE PASS -->

        <div>

          <div class="train"></div>


          <div class="pass-label">
            Multi Use Pass
          </div>

        </div>

      </div>



      <!-- ===================================================
           BARCODE
      ==================================================== -->

      <div class="barcode-section">

        <div class="ticket-number">

          Ticket Number:

          <strong>
            MZ68122693
          </strong>

        </div>


        <div class="barcode">

          <div class="barcode-lines"></div>


          <div class="active-box">
            ACTIVE
          </div>

        </div>


        <!-- TIMERS -->

        <div class="timers">

          <div>

            <div class="timer-title">
              CURRENT DATE & TIME:
            </div>


            <div
              class="timer-value"
              id="currentTime"
            >
              --
            </div>

          </div>


          <div>

            <div class="timer-title">
              TIME SINCE ACTIVATION:
            </div>


            <div
              class="timer-value"
              id="activationTime"
            >
              00:18:59
            </div>

          </div>

        </div>

      </div>

    </section>



    <!-- =====================================================
         BOTTOM
    ====================================================== -->

    <section class="bottom">

      <div class="bottom-message">

        Please show proof of your ticket to
        <br />

        the Customer Protective Officers
        <br />

        when asked

      </div>


      <div
        class="countdown"
        id="countdown"
      >
        23:41:00
      </div>

    </section>

  </main>



  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    /*
      Activation timestamp.

      This starts the ticket 18 minutes and
      59 seconds before the page loads.
    */

    const activation = new Date();

    activation.setSeconds(
      activation.getSeconds() - (18 * 60 + 59)
    );


    /*
      Ticket expires 24 hours after activation.
    */

    const expiration =
      new Date(
        activation.getTime() +
        24 * 60 * 60 * 1000
      );


    /*
      Add leading zero.
    */

    function pad(number) {

      return String(number).padStart(2, "0");

    }


    /*
      Update everything every second.
    */

    function updateClock() {

      const now = new Date();


      /* =========================================
         CURRENT DATE & TIME
      ========================================= */

      const current =
        `${now.toLocaleString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric"
        })} ${now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        })}`;


      document.getElementById(
        "currentTime"
      ).textContent = current;



      /* =========================================
         TIME SINCE ACTIVATION
      ========================================= */

      const elapsed =
        Math.max(
          0,
          now - activation
        );


      const totalSeconds =
        Math.floor(
          elapsed / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      document.getElementById(
        "activationTime"
      ).textContent =
        `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;



      /* =========================================
         COUNTDOWN
      ========================================= */

      const remaining =
        Math.max(
          0,
          expiration - now
        );


      const remainingSeconds =
        Math.floor(
          remaining / 1000
        );


      const h =
        Math.floor(
          remainingSeconds / 3600
        );


      const m =
        Math.floor(
          (remainingSeconds % 3600) / 60
        );


      const s =
        remainingSeconds % 60;


      document.getElementById(
        "countdown"
      ).textContent =
        `${pad(h)}:${pad(m)}:${pad(s)}`;

    }


    /*
      Run immediately.
    */

    updateClock();


    /*
      Update once every second.
    */

    setInterval(
      updateClock,
      1000
    );

  </script>

</body>
</html>
